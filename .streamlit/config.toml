# MMC Delta Scanner - application theme.
#
# These values match the tokens in mmc_core/theme.py exactly, and the two must
# be changed together: this file colours Streamlit's own widgets, while
# theme.py colours our CSS and charts. If they drift apart the app splits into
# two mismatched halves, so a test asserts they stay in sync.
#
# Dark is fixed deliberately - this is a trading terminal that people read for
# hours. The full reasoning is in theme.py's module docstring.

[theme]
base = "dark"
primaryColor = "#3987e5"             # SERIES_1 - links, focus rings, sliders
backgroundColor = "#0d0d0c"          # SURFACE_0 - page plane
secondaryBackgroundColor = "#12120f" # SURFACE_1 - sidebar, cards, table header
textColor = "#ffffff"                # INK_1
font = "sans serif"

[server]
# Chain data changes every refresh window; nothing is ever uploaded.
maxUploadSize = 5

[browser]
gatherUsageStats = false
